name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-venv python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 dpkg-dev
      - run: ./packaging/build-deb.sh
      - run: cd dist && sha256sum nitum-pdf_*.deb > "$(basename nitum-pdf_*.deb).sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/nitum-pdf_*.deb
            dist/nitum-pdf_*.deb.sha256
