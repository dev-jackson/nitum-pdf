name: Visual review

on:
  pull_request:

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y python3-venv python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb adwaita-icon-theme fonts-dejavu-core
      - run: python3 -m venv --system-site-packages .venv
      - run: .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/python scripts/make_sample.py /tmp/nitum-sample.pdf
      - run: xvfb-run -a .venv/bin/python scripts/screenshot.py /tmp/nitum-sample.pdf visual-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nitum-pdf-ui
          path: visual-artifacts/*.png
