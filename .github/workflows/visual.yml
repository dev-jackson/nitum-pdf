name: Visual review

on:
  pull_request:

concurrency:
  group: visual-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libssl-dev
      - run: rustup update stable && rustup default stable
      - name: Render light, dark and complete-flow snapshots
        working-directory: native
        env:
          NITUM_VISUAL_OUTPUT: ../visual-artifacts
        run: cargo test --locked --test visual_shell -- --nocapture
      - uses: actions/upload-artifact@v7
        with:
          name: nitum-pdf-ui
          path: visual-artifacts/*.png
