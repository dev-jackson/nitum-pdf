[package]
name = "nitum-pdf"
version = "0.8.1"
edition = "2024"
license = "MIT"
description = "Nitum PDF native desktop interface"

[dependencies]
anyhow = "1.0"
arboard = "3.6"
bergshamra-pkcs12 = "0.8.0"
cryptoki = "0.12.0"
directories = "6.0.0"
der = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
openssl = { version = "0.10", features = ["vendored"] }
pdfium-render = { version = "0.9.3", default-features = false, features = ["pdfium_latest", "image_latest", "thread_safe"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.17.2"
rustls-native-certs = "0.8.4"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
# `unstable-winit-030` exposes the underlying winit window, which is what lets a
# frameless window be dragged by its own title bar: asking the compositor to
# move the window is the only method Wayland honours.
slint = { version = "1.17.1", features = ["renderer-skia", "unstable-winit-030"] }
tempfile = "3.23"
tokio = { version = "1.53", features = ["rt-multi-thread"] }
underskrift = { path = "vendor/underskrift" }
zeroize = "1.9"
# Local civil time for the visible signature stamp, with a real time zone
# database: the stamp is read by people, in their own local time.
jiff = "0.2"
x509-cert = "0.2"
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }

[build-dependencies]
slint-build = "1.17.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.30"

[dev-dependencies]
i-slint-backend-testing = { version = "1.17.1", features = ["renderer-software"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
