<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Nitum PDF">
  <defs>
    <linearGradient id="tile" x1="20" y1="10" x2="108" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4323C"/><stop offset="1" stop-color="#A00E1C"/>
    </linearGradient>
    <linearGradient id="ink" x1="36" y1="60" x2="96" y2="94" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D31F2B"/><stop offset="1" stop-color="#7E0A16"/>
    </linearGradient>
  </defs>

  <!-- Family tile: shared across the Nitum suite; only the hue and the glyph change. -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#tile)"/>

  <!-- Document sheet with the family corner fold. -->
  <path d="M32 22h44l22 22v54a10 10 0 0 1-10 10H32a10 10 0 0 1-10-10V32a10 10 0 0 1 10-10z" fill="#FFFFFF"/>
  <path d="M76 22v16a6 6 0 0 0 6 6h16z" fill="#F0AAB0"/>

  <!-- Signature glyph: one continuous stroke, the mark that identifies the PDF app. -->
  <path d="M34 84c6-22 13-30 19-27 7 3 2 24 9 25 8 1 13-23 20-20 6 3 0 16 6 17 5 1 9-5 12-10"
        fill="none" stroke="url(#ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Signed baseline: a ruled line at large sizes, added weight at 16 px. -->
  <path d="M38 96h44" stroke="#EFC2C6" stroke-width="5" stroke-linecap="round"/>
</svg>
